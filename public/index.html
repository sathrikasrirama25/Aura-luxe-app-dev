<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="LuxeCart - Your Shopping Application. A complete, modern, mobile-friendly e-commerce web application featuring high-quality products, instant search, dynamic cart, checkout, and demo payment.">
  <title>LuxeCart - Your Shopping Application</title>

  <!-- Google Fonts: Outfit (Brand & Headings) & Inter (Body UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Free Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- React 18 & Babel Standalone for Instant Execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root">
    <!-- Initial Loading Fallback before React mounts -->
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #fff; font-family: 'Outfit', sans-serif;">
      <div style="font-size: 2.2rem; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px;">
        <i class="fa-solid fa-bag-shopping" style="color: #3b82f6; margin-right: 10px;"></i>LuxeCart
      </div>
      <div style="font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px;">Your Shopping Application</div>
      <div style="margin-top: 24px; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Products Data Service Script -->
  <script src="js/products-data.js"></script>

  <!-- React Application Core Script (Transpiled by Babel) -->
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
